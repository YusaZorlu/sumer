<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Sumer</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #1e1814; }
  /* The game gives the canvas the screen's own pixels (see PageFrame in web.c); this stretches it over
     the window. No browser gestures on it: a finger on the game is the game's. */
  canvas { display: block; outline: none; position: fixed; left: 0; top: 0; width: 100%; height: 100%; touch-action: none; }
  #status { position: absolute; top: 45%; width: 100%; text-align: center; color: #f0e6d2; font: 18px sans-serif; }
</style>
</head>
<body>
<div id="status">Loading Sumer...</div>
<canvas id="canvas" tabindex="-1"></canvas>
<script>
  var canvas = document.getElementById('canvas');
  var Module = {
    canvas: canvas,
    print: function (t) { console.log(t); },
    printErr: function (t) { console.warn(t); },
    setStatus: function (t) { document.getElementById('status').textContent = t || ''; },
    onRuntimeInitialized: function () { document.getElementById('status').style.display = 'none'; canvas.focus(); }
  };
  // The game draws with WebGL 2: where the browser has none, say so instead of failing on the way in.
  try { Module.noWebGL2 = !document.createElement('canvas').getContext('webgl2'); } catch (e) { Module.noWebGL2 = true; }
  if (Module.noWebGL2) {
    Module.noInitialRun = true;
    Module.setStatus = function () {};
    document.getElementById('status').textContent = 'Sumer needs WebGL 2: please update your browser (Chrome, Edge, Firefox, Safari 15 or newer). / ' +
      'Sumer WebGL 2 ister: lütfen tarayıcını güncelle.';
  }
  // The game asks for the mouse (Module.sumerWantLock); a browser hands it over only during a click.
  canvas.addEventListener('mousedown', function () {
    canvas.focus();
    if (Module.sumerWantLock && !document.pointerLockElement) {
      try {
        var p = canvas.requestPointerLock();
        if (p && p.catch) p.catch(function () {});
      } catch (e) {}
    }
  });
  canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  // On a phone the game takes the whole screen, the browser's bars hidden, at a touch: a browser allows it
  // only during one. Left (the back gesture), the next touch brings it back.
  var phone = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent || '') ||
              (window.matchMedia && window.matchMedia('(pointer: coarse)').matches);
  canvas.addEventListener('touchend', function () {
    var d = document.documentElement;
    if (!phone || document.fullscreenElement || document.webkitFullscreenElement) return;
    var landscape = function () {
      if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(function () {});
    };
    try {
      if (d.requestFullscreen) d.requestFullscreen({ navigationUI: 'hide' }).then(landscape).catch(function () {});
      else if (d.webkitRequestFullscreen) d.webkitRequestFullscreen();
    } catch (e) {}
  });
  // F5 saves the game here instead of reloading the page.
  window.addEventListener('keydown', function (e) {
    if (e.key === 'F5' || e.key === 'F1') e.preventDefault();
  }, true);
  window.addEventListener('error', function (e) {
    if (Module.noWebGL2) return;
    Module.setStatus('Something went wrong: ' + e.message);
    document.getElementById('status').style.display = '';
  });
</script>
{{{ SCRIPT }}}
</body>
</html>
