<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Sumer</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #1e1814; }
  /* The game gives the canvas the screen's own pixels (see PageFrame in web.c); this stretches it over
     the window. No browser gestures on it: a finger on the game is the game's. */
  canvas { display: block; outline: none; position: fixed; left: 0; top: 0; width: 100%; height: 100%; touch-action: none; }
  #status { position: absolute; top: 45%; width: 100%; text-align: center; color: #f0e6d2; font: 18px sans-serif; }
  /* The account fields: the title screen draws their frames and labels and places them (AccountForm in web.c). */
  input.acct { display: none; position: fixed; box-sizing: border-box; margin: 0; padding: 0 0.5em; border: 0; outline: none;
               background: transparent; color: #f0e6d2; font-family: sans-serif; z-index: 2; }
  input.acct::placeholder { color: #8a7c66; }
  /* Typing on a phone: the keyboard would cover the field, so it moves to the top of what is still visible,
     large, with what it is for written over it. */
  input.acct.typing { left: 4% !important; width: 92% !important; height: 48px !important; top: var(--typing-top, 40px) !important;
                      font-size: 22px !important; background: #3a3026 !important; border: 2px solid #f0c878 !important; z-index: 6; }
  #acctTip { display: none; position: fixed; left: 4%; width: 92%; color: #f0c878; font: 17px sans-serif; z-index: 6;
             background: #1e1814; padding: 6px 0 4px; }
</style>
</head>
<body>
<div id="status">Loading Sumer...</div>
<canvas id="canvas" tabindex="-1"></canvas>
<input id="acctName" class="acct" type="text" autocomplete="username" maxlength="15" spellcheck="false" autocapitalize="off" autocorrect="off">
<input id="acctPass" class="acct" type="password" autocomplete="current-password" maxlength="128">
<input id="acctPass2" class="acct" type="password" autocomplete="new-password" maxlength="128">
<input id="acctPass3" class="acct" type="password" autocomplete="new-password" maxlength="128">
<div id="acctTip"></div>
<script>
  var canvas = document.getElementById('canvas');
  var Module = {
    canvas: canvas,
    print: function (t) { console.log(t); },
    printErr: function (t) { console.warn(t); },
    setStatus: function (t) { document.getElementById('status').textContent = t || ''; },
    onRuntimeInitialized: function () { document.getElementById('status').style.display = 'none'; canvas.focus(); }
  };
  // The game draws with WebGL 2: where the browser has none, say so instead of failing on the way in.
  try { Module.noWebGL2 = !document.createElement('canvas').getContext('webgl2'); } catch (e) { Module.noWebGL2 = true; }
  if (Module.noWebGL2) {
    Module.noInitialRun = true;
    Module.setStatus = function () {};
    document.getElementById('status').textContent = 'Sumer needs WebGL 2: please update your browser (Chrome, Edge, Firefox, Safari 15 or newer). / ' +
      'Sumer WebGL 2 ister: lütfen tarayıcını güncelle.';
  }
  // The game asks for the mouse (Module.sumerWantLock); a browser hands it over only during a click.
  canvas.addEventListener('mousedown', function () {
    canvas.focus();
    if (Module.sumerWantLock && !document.pointerLockElement) {
      try {
        var p = canvas.requestPointerLock();
        if (p && p.catch) p.catch(function () {});
      } catch (e) {}
    }
  });
  canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  // On a phone the game takes the whole screen, the browser's bars hidden, at a touch: a browser allows it
  // only during one. Left (the back gesture), the next touch brings it back.
  var phone = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent || '') ||
              (window.matchMedia && window.matchMedia('(pointer: coarse)').matches);
  canvas.addEventListener('touchend', function () {
    var d = document.documentElement;
    if (!phone || document.fullscreenElement || document.webkitFullscreenElement) return;
    var landscape = function () {
      if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(function () {});
    };
    try {
      if (d.requestFullscreen) d.requestFullscreen({ navigationUI: 'hide' }).then(landscape).catch(function () {});
      else if (d.webkitRequestFullscreen) d.webkitRequestFullscreen();
    } catch (e) {}
  });
  // What is typed in the account fields is not the game's: the game's own key handlers (which keep some
  // keys, Backspace among them, from the page) do not hear it. Enter in them asks the game to go on.
  ['keydown', 'keyup', 'keypress'].forEach(function (kind) {
    window.addEventListener(kind, function (e) {
      if (!e.target || !e.target.classList || !e.target.classList.contains('acct')) return;
      e.stopImmediatePropagation();
      if (kind !== 'keydown' || e.key !== 'Enter') return;
      // Enter goes on to the next field while it is empty; at the last one it asks the game to go on.
      var shown = Array.prototype.filter.call(document.querySelectorAll('input.acct'), function (f) { return f.style.display === 'block'; });
      var next = shown[shown.indexOf(e.target) + 1];
      if (next && !next.value) { e.preventDefault(); next.focus(); }
      else Module.sumerAcctEnter = 1;
    }, true);
  });
  var touchy = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
  var tip = document.getElementById('acctTip');
  var placeTyping = function () {
    var top = window.visualViewport ? window.visualViewport.offsetTop : 0;
    tip.style.top = top + 'px';
    document.documentElement.style.setProperty('--typing-top', (top + 32) + 'px');
  };
  Array.prototype.forEach.call(document.querySelectorAll('input.acct'), function (f) {
    f.addEventListener('focus', function () {
      if (!touchy) return;
      f.classList.add('typing');
      tip.textContent = f.placeholder;
      tip.style.display = 'block';
      placeTyping();
    });
    f.addEventListener('blur', function () {
      f.classList.remove('typing');
      tip.style.display = 'none';
    });
  });
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', placeTyping);
    window.visualViewport.addEventListener('scroll', placeTyping);
  }
  // F5 saves the game here instead of reloading the page.
  window.addEventListener('keydown', function (e) {
    if (e.key === 'F5' || e.key === 'F1') e.preventDefault();
  }, true);
  window.addEventListener('error', function (e) {
    if (Module.noWebGL2) return;
    Module.setStatus('Something went wrong: ' + e.message);
    document.getElementById('status').style.display = '';
  });
</script>
{{{ SCRIPT }}}
</body>
</html>
